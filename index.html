<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Society Milk Collection</title>
  <link rel="stylesheet" href="/styles.css" />
  
</head>
<body>
  <header class="header">
    <div class="brand">
      <h1>Society Milk Collection</h1>
    </div>
    <div class="header-art">
      <button id="logoutBtn" class="btn-secondary">Logout</button>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>New Collection Entry</h2>
      <form id="collectionForm" novalidate>
        <div class="grid">
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required />
          </div>
          <div class="field">
            <label for="session">Session</label>
            <select id="session" name="session" required>
              <option value="Morning">Morning</option>
              <option value="Evening">Evening</option>
            </select>
          </div>
          <div class="field">
            <label for="milk_type">Milk Type</label>
            <select id="milk_type" name="milk_type" required>
              <option value="Cow">Cow</option>
              <option value="Buffalo">Buffalo</option>
            </select>
          </div>
          <div class="field">
            <label for="farmer_id">Farmer ID</label>
            <input type="text" id="farmer_id" name="farmer_id" placeholder="e.g. F001" required />
          </div>
          <div class="field">
            <label for="farmer_name">Farmer Name</label>
            <input type="text" id="farmer_name" name="farmer_name" placeholder="Optional" />
          </div>
          <div class="field">
            <label for="fat">FAT %</label>
            <input type="number" step="0.1" id="fat" name="fat" required />
            <small id="fatHint" class="hint"></small>
          </div>
          <div class="field">
            <label for="snf">SNF %</label>
            <input type="number" step="0.1" id="snf" name="snf" required />
            <small id="snfHint" class="hint"></small>
          </div>
          <div class="field">
            <label for="quantity">Quantity (L)</label>
            <input type="number" step="0.01" id="quantity" name="quantity" required />
          </div>
        </div>
        <div id="messages" class="messages" role="alert" aria-live="polite"></div>
        <div class="actions">
          <button type="submit" class="btn-primary">Save Entry</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Daily Report</h2>
        <div class="filters">
          <input type="date" id="filterDate" />
          <button id="refreshBtn" class="btn-secondary">Refresh</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="table" id="reportTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Session</th>
              <th>Farmer</th>
              <th>Type</th>
              <th>FAT</th>
              <th>SNF</th>
              <th>Qty (L)</th>
              <th>Rate</th>
              <th>Amount</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Records are saved only after validation. Rates are auto-calculated; manual entry is disabled.</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
